<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F5" />
  <title>Sena — You're offline</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #FAF8F5;
      color: #191816;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E2DA;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 4px 20px -2px rgba(25, 24, 22, 0.05);
    }
    .brand {
      letter-spacing: 0.18em;
      text-transform: lowercase;
      font-size: 12px;
      font-weight: 600;
      color: #B85C3E;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #191816;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #7A7267;
      margin-bottom: 12px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F5EFE9;
      border: 1px solid #E8E2DA;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #71382D;
      margin: 16px 0 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #B85C3E;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      background: #191816;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: default;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #A39B90;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">sena</div>
    <h1>You're offline</h1>
    <p>
      Sena needs an internet connection to load current hotel operations.
    </p>
    <p>
      Your reservations, rooms, payments and housekeeping data have not been replaced with stale information.
    </p>
    <div class="status-pill">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Waiting for internet connection</span>
    </div>
    <button class="btn-primary" id="retry-btn" type="button">
      Try again
    </button>
    <div class="footer-note">
      Hospitality, simplified
    </div>
  </div>
  <script>
    const RELOAD_KEY = 'sena-offline-retry-at';

    function canReload() {
      try {
        const last = Number(sessionStorage.getItem(RELOAD_KEY) || '0');
        if (Date.now() - last < 4000) return false;
        sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
        return true;
      } catch (error) {
        return true;
      }
    }

    function setStatus(online) {
      const statusText = document.getElementById('status-text');
      const statusDot = document.getElementById('status-dot');
      if (online) {
        statusText.textContent = 'Connection detected';
        statusDot.style.background = '#2E7D32';
      } else {
        statusText.textContent = 'Waiting for internet connection';
        statusDot.style.background = '#B85C3E';
      }
    }

    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      btn.textContent = 'Checking…';
      btn.disabled = true;
      if (!navigator.onLine) {
        setStatus(false);
        window.setTimeout(function () {
          btn.textContent = 'Try again';
          btn.disabled = false;
        }, 800);
        return;
      }
      if (!canReload()) {
        btn.textContent = 'Try again';
        btn.disabled = false;
        return;
      }
      window.location.reload();
    }

    document.getElementById('retry-btn').addEventListener('click', retryConnection);
    window.addEventListener('online', function () {
      setStatus(true);
      retryConnection();
    });
    window.addEventListener('offline', function () {
      setStatus(false);
    });
    setStatus(navigator.onLine);
  </script>
</body>
</html>
