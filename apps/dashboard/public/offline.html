<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F5" />
  <title>Sena — You're offline</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #FAF8F5;
      color: #191816;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E2DA;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 4px 20px -2px rgba(25, 24, 22, 0.05);
    }
    .brand {
      letter-spacing: 0.18em;
      text-transform: lowercase;
      font-size: 12px;
      font-weight: 600;
      color: #B85C3E;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #191816;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #7A7267;
      margin-bottom: 12px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F5EFE9;
      border: 1px solid #E8E2DA;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #71382D;
      margin: 16px 0 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #B85C3E;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      background: #191816;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: default;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #A39B90;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">sena</div>
    <h1>You're offline</h1>
    <p>
      Sena needs an internet connection to load current hotel operations.
    </p>
    <p>
      Your reservations, rooms, payments and housekeeping data have not been replaced with stale information.
    </p>
    <div class="status-pill">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Waiting for internet connection</span>
    </div>
    <button class="btn-primary" id="retry-btn" type="button">
      Try again
    </button>
    <div class="footer-note">
      Hospitality, simplified
    </div>
  </div>
  <script>
    const COPY = {
      en: { title: "You're offline", p1: "Sena needs an internet connection to load current hotel operations.", p2: "Your reservations, rooms, payments and housekeeping data have not been replaced with stale information.", waiting: "Waiting for internet connection", retry: "Try again", checking: "Checking…", online: "Connection detected", footer: "Hospitality, simplified" },
      fr: { title: "Vous êtes hors ligne", p1: "Sena a besoin d'une connexion pour charger les opérations de l'hôtel.", p2: "Vos réservations, chambres, paiements et gouvernance n'ont pas été remplacés par des données périmées.", waiting: "En attente de connexion", retry: "Réessayer", checking: "Vérification…", online: "Connexion détectée", footer: "L'hospitalité, simplifiée." },
      ar: { title: "أنت غير متصل", p1: "يحتاج Sena إلى اتصال بالإنترنت لتحميل عمليات الفندق الحالية.", p2: "لم تُستبدل حجوزاتك وغرفك ومدفوعاتك وبيانات التدبير الفندقي بمعلومات قديمة.", waiting: "بانتظار الاتصال", retry: "إعادة المحاولة", checking: "جارٍ التحقق…", online: "تم اكتشاف الاتصال", footer: "الضيافة، ببساطة." },
      sw: { title: "Hujaunganishwa", p1: "Sena inahitaji muunganisho kupakia shughuli za sasa za hoteli.", p2: "Uhifadhi, vyumba, malipo na usafi havijabadilishwa na taarifa za zamani.", waiting: "Inasubiri muunganisho", retry: "Jaribu tena", checking: "Inakagua…", online: "Muunganisho umepatikana", footer: "ukarimu, kwa urahisi." },
      yo: { title: "O kò sí lórí ayélujára", p1: "Sena nílò àsopọ̀ láti kó iṣẹ́ ilé-ìtura wá.", p2: "A kò rọ́pò ìfipamọ́, yàrá, ìsanwó àti ìtọ́jú pẹ̀lú àlàyé àtijọ́.", waiting: "Ń dúró fún àsopọ̀", retry: "Gbìyànjú lẹ́ẹ̀kan si", checking: "Ń yẹ̀wò…", online: "A rí àsopọ̀", footer: "ìtẹ́wọ́gbà, ní ìrọ̀rùn." },
      ha: { title: "Ba ka kan layi ba", p1: "Sena na buƙatar haɗin yanar gizo don loda ayyukan otal na yanzu.", p2: "Ba a maye gurbin ajiya, dakuna, biya da tsafta da bayanai marasa sabuntawa ba.", waiting: "Ana jiran haɗin", retry: "Sake gwadawa", checking: "Ana duba…", online: "An gano haɗin", footer: "karimci, cikin sauƙi." },
      ig: { title: "Ị nọghị n'ịntanetị", p1: "Sena chọrọ njikọ ịntanetị iji bulite ọrụ ụlọ oriri ugbu a.", p2: "Agbanweghị nchekwa, ime ụlọ, ịkwụ ụgwọ na nlekọta gị jiri ozi ochie.", waiting: "Na-eche njikọ", retry: "Nwaa ọzọ", checking: "Na-enyocha…", online: "Ahụrụ njikọ", footer: "nnabata, n'ụzọ dị mfe." }
    };
    const locale = (document.cookie.match(/(?:^|; )sena_locale=([^;]*)/) || [])[1] || 'en';
    const copy = COPY[locale] || COPY.en;
    document.documentElement.lang = locale === 'ar' ? 'ar' : locale;
    document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
    document.title = 'Sena — ' + copy.title;
    document.querySelector('h1').textContent = copy.title;
    document.querySelectorAll('.card > p')[0].textContent = copy.p1;
    document.querySelectorAll('.card > p')[1].textContent = copy.p2;
    document.getElementById('retry-btn').textContent = copy.retry;
    document.querySelector('.footer-note').textContent = copy.footer;

    const RELOAD_KEY = 'sena-offline-retry-at';

    function canReload() {
      try {
        const last = Number(sessionStorage.getItem(RELOAD_KEY) || '0');
        if (Date.now() - last < 4000) return false;
        sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
        return true;
      } catch (error) {
        return true;
      }
    }

    function setStatus(online) {
      const statusText = document.getElementById('status-text');
      const statusDot = document.getElementById('status-dot');
      if (online) {
        statusText.textContent = copy.online;
        statusDot.style.background = '#2E7D32';
      } else {
        statusText.textContent = copy.waiting;
        statusDot.style.background = '#B85C3E';
      }
    }

    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      btn.textContent = copy.checking;
      btn.disabled = true;
      if (!navigator.onLine) {
        setStatus(false);
        window.setTimeout(function () {
          btn.textContent = copy.retry;
          btn.disabled = false;
        }, 800);
        return;
      }
      if (!canReload()) {
        btn.textContent = copy.retry;
        btn.disabled = false;
        return;
      }
      window.location.reload();
    }

    document.getElementById('retry-btn').addEventListener('click', retryConnection);
    window.addEventListener('online', function () {
      setStatus(true);
      retryConnection();
    });
    window.addEventListener('offline', function () {
      setStatus(false);
    });
    setStatus(navigator.onLine);
  </script>
</body>
</html>
