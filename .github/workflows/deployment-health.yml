name: Deployment Health Check

# Vercel sends `vercel.deployment.ready` after a deployment is built but before
# Deployment Checks run, so this workflow can gate promotion to production.
on:
  repository_dispatch:
    types: ['vercel.deployment.ready']

concurrency:
  group: deployment-health-${{ github.event.client_payload.id }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  health:
    name: health
    # Only the dashboard project serves /api/health. The admin and marketing
    # projects deploy from the same commit, and without this filter their
    # dispatches overwrite this check's status on that commit.
    if: |
      github.event.client_payload.environment == 'production' &&
      contains(fromJSON('["sena", "sena-app"]'), github.event.client_payload.project.name)
    runs-on: ubuntu-latest
    steps:
      # Write statuses directly for the SHA from Vercel's event. The Vercel
      # helper action queries the current run's job list, which can return 404
      # before a repository_dispatch run is visible through the Actions API.
      - name: Report pending deployment status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOYMENT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid deployment commit SHA" >&2
            exit 1
          fi
          for attempt in $(seq 1 5); do
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYMENT_SHA}" \
              -f state=pending \
              -f context='Vercel - sena-app: health' \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null; then
              exit 0
            fi
            [ "${attempt}" -eq 5 ] && exit 1
            sleep 2
          done

      - name: Probe deployment health endpoint
        id: health_probe
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          url="https://${DEPLOYMENT_URL#https://}"
          url="${url%/}/api/health"
          echo "Probing ${url}"

          headers=()
          if [ -n "${BYPASS_SECRET}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${BYPASS_SECRET}")
          fi

          # A freshly built deployment can serve the Vercel Authentication page
          # for a few seconds before the bypass secret reaches its edge config,
          # so treat any unexpected body as retryable, not just network errors.
          body=""
          for attempt in $(seq 1 10); do
            body=$(curl --silent --show-error --max-time 15 \
              "${headers[@]}" "${url}" || true)
            if printf '%s' "${body}" | grep -q '"status":"ok"'; then
              echo "Response: ${body}"
              break
            fi
            if [ "${attempt}" -eq 10 ]; then
              echo "Health check failed after ${attempt} attempts. Last response: ${body}" >&2
              exit 1
            fi
            echo "Attempt ${attempt} not healthy; retrying in 6s"
            sleep 6
          done

          echo "Deployment is healthy"

      - name: Report final deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event.client_payload.git.sha }}
          HEALTH_OUTCOME: ${{ steps.health_probe.outcome }}
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOYMENT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid deployment commit SHA" >&2
            exit 1
          fi
          state=success
          if [ "${HEALTH_OUTCOME}" != success ]; then
            state=failure
          fi
          for attempt in $(seq 1 5); do
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOYMENT_SHA}" \
              -f "state=${state}" \
              -f context='Vercel - sena-app: health' \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null; then
              exit 0
            fi
            [ "${attempt}" -eq 5 ] && exit 1
            sleep 2
          done
